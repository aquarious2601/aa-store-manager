# AA Shop Manager — nginx vhost
#
# Serves:
#   - The compiled React app from /home/ubuntu/aashop/frontend/dist
#   - The Symfony API at /api/* (and /api/docs) via PHP-FPM
#
# Replace `app.aashop.com` with your real domain. certbot --nginx will edit
# this file in place to add the TLS + HTTP-redirect blocks automatically.

server {
    listen 80;
    listen [::]:80;
    server_name app.aashop.com;

    root /home/ubuntu/aashop/frontend/dist;
    index index.html;

    # Hide hidden files except .well-known (Let's Encrypt uses it)
    location ~ /\.(?!well-known) {
        deny all;
    }

    # --- API routes -> Symfony front controller -----------------------------
    location ^~ /api {
        # Pass through to PHP. We rewrite to the Symfony index so /api/anything
        # always ends up at backend/public/index.php which the Symfony router
        # handles internally.
        try_files $uri /index.php$is_args$args;
    }

    # When PHP needs to serve a file, it lives in backend/public/.
    location ~ ^/index\.php(/|$) {
        root /home/ubuntu/aashop/backend/public;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $document_root;
        # Sane upload + timeout values for our admin app
        fastcgi_read_timeout 1800;       # long enough for the fetch-new-orders job
        client_max_body_size 16M;
        internal;
    }

    # --- Static React assets ------------------------------------------------
    # Cache hashed Vite assets aggressively (filenames already contain hashes)
    location /assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else falls back to the SPA's index.html so React-Router can
    # handle client-side routing (/orders, /products, /sales, /sales/:id, …).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Hardening ----------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Gzip text responses
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss text/javascript;
}
